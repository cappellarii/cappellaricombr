<!DOCTYPE html>
<html>
<head>
    <title>Chat simples</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon"/>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body class="css-selector">
    <div class="container">
        <h2>Chat</h2>

    <div id="chat"></div>

    <form class="composer" id="composerForm">
      <input
        type="text"
        name="text"
        id="messageInput"
        class="search-bar"
        placeholder="Digite sua mensagem"
        required
      />
      <button id="sendButton" type="submit">Enviar</button>
    </form>

    </div>

    <a
      class="github-link"
      href="https://github.com/cappellarii"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="GitHub profile"
      title="GitHub"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.2 11.38.6.1.82-.26.82-.58 0-.28-.01-1.04-.02-2.04-3.34.72-4.04-1.61-4.04-1.61-.55-1.38-1.33-1.75-1.33-1.75-1.09-.74.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.08 1.84 2.82 1.31 3.5 1 .1-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.17 0 0 1.01-.32 3.3 1.23a11.4 11.4 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.65.24 2.87.12 3.17.77.84 1.24 1.91 1.24 3.22 0 4.61-2.8 5.62-5.48 5.92.43.38.82 1.11.82 2.24 0 1.62-.02 2.92-.02 3.32 0 .32.21.69.83.57A12 12 0 0 0 24 12c0-6.63-5.37-12-12-12Z"></path>
      </svg>
    </a>

    <script>
        async function load() {
            const res = await fetch("/messages");
            const data = await res.json();

            const chat = document.getElementById("chat");
            chat.innerHTML = "";

            data.reverse().forEach(m => {
                const div = document.createElement("div");
                div.textContent = m.text;
                chat.appendChild(div);
            });

            chat.scrollTop = chat.scrollHeight;
        }

        async function send() {
          const input = document.getElementById("messageInput");
          const text = input.value.trim();

          if (!text) {
            return;
          }

            await fetch("/messages", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text })
            });

            input.value = "";
            load();
        }

        setInterval(load, 2000);
        load();

        document.getElementById("composerForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            await send();
        });
    </script>

</body>
</html>
