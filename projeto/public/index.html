    function requestVoiceJoin(channelId) {
      return new Promise((resolve, reject) => {
        if (!voiceSocket) {
          reject(new Error("Socket de voz indisponivel"));
          return;
        }

        let settled = false;
        const timeoutId = setTimeout(() => {
          if (settled) {
            return;
          }

          settled = true;
          reject(new Error("Tempo de resposta do canal de voz excedido"));
        }, 5000);

        voiceSocket.emit("voice:join", { channelId }, (result = {}) => {
          if (settled) {
            return;
          }

          settled = true;
          clearTimeout(timeoutId);

          if (result.ok) {
            resolve(result);
            return;
          }

          reject(new Error(result.error || "Nao foi possivel entrar no canal de voz"));
        });
      });
    }

    function clampVolumePercent(value) {
      const parsed = Number.parseInt(value, 10);

      if (!Number.isFinite(parsed)) {
        return 100;
      }

      return Math.min(300, Math.max(0, parsed));
    }

    function loadVolumePreferences() {
      inputVolumePercent = clampVolumePercent(localStorage.getItem(INPUT_VOLUME_KEY));
      outputVolumePercent = clampVolumePercent(localStorage.getItem(OUTPUT_VOLUME_KEY));
    }

    function updateVolumeUi() {
      inputVolumeRange.value = String(inputVolumePercent);
      outputVolumeRange.value = String(outputVolumePercent);
      inputVolumeValue.textContent = `${inputVolumePercent}%`;
      outputVolumeValue.textContent = `${outputVolumePercent}%`;
    }

    function getInputGainValue() {
      return Math.max(0, inputVolumePercent / 100);
    }

    function getOutputGainValue() {
      return Math.max(0, outputVolumePercent / 100);
    }

    function applyInputGainValue() {
      if (voiceProcessingInputGainNode && voiceProcessingContext) {
        voiceProcessingInputGainNode.gain.setTargetAtTime(getInputGainValue(), voiceProcessingContext.currentTime, 0.02);
      }
    }

    function applyOutputGainValue() {
      for (const pipeline of remoteAudioPipelines.values()) {
        if (pipeline.gainNode && pipeline.context) {
          const target = isDeafened ? 0 : getOutputGainValue();
          pipeline.gainNode.gain.setTargetAtTime(target, pipeline.context.currentTime, 0.02);
        } else if (pipeline.audioElement) {
          pipeline.audioElement.volume = Math.min(1, outputVolumePercent / 100);
          pipeline.audioElement.muted = isDeafened;
        }
      }
    }

    function createRemoteAudioPipeline(socketId, stream) {
      let audio = document.getElementById(`voice-audio-${socketId}`);

      if (!audio) {
        audio = document.createElement("audio");
        audio.id = `voice-audio-${socketId}`;
        audio.autoplay = true;
        document.body.appendChild(audio);
      }

      audio.srcObject = stream;

      const AudioCtx = window.AudioContext || window.webkitAudioContext;

      if (!AudioCtx) {
        audio.volume = Math.min(1, outputVolumePercent / 100);
        audio.muted = isDeafened;
        remoteAudioPipelines.set(socketId, { audioElement: audio });
        return;
      }

      try {
        const context = new AudioCtx();
        const source = context.createMediaStreamSource(stream);
        const gainNode = context.createGain();

        gainNode.gain.value = isDeafened ? 0 : getOutputGainValue();
        source.connect(gainNode);
        gainNode.connect(context.destination);

        // Evita duplicar audio do elemento, mantendo somente pelo pipeline.
        audio.muted = true;

        remoteAudioPipelines.set(socketId, {
          context,
          source,
          gainNode,
          audioElement: audio
        });
      } catch (_err) {
        audio.volume = Math.min(1, outputVolumePercent / 100);
        audio.muted = isDeafened;
        remoteAudioPipelines.set(socketId, { audioElement: audio });
      }
    }

    function destroyRemoteAudioPipeline(socketId) {
      const pipeline = remoteAudioPipelines.get(socketId);

      if (pipeline?.context) {
        pipeline.context.close().catch(() => {});
      }

      remoteAudioPipelines.delete(socketId);
    }

    function buildAudioConstraints() {
      return {
        noiseSuppression: isNoiseSuppressionEnabled,
        echoCancellation: isNoiseSuppressionEnabled,
        autoGainControl: isNoiseSuppressionEnabled,
        channelCount: 1
      };
    }

    function stopVoiceProcessingPipeline() {
      if (voiceProcessingIntervalId) {
        clearInterval(voiceProcessingIntervalId);
        voiceProcessingIntervalId = null;
      }

      voiceProcessingGateNode = null;
      voiceProcessingInputGainNode = null;
      outboundAudioStream = localAudioStream;

      if (voiceProcessingContext) {
        voiceProcessingContext.close().catch(() => {});
        voiceProcessingContext = null;
      }
    }

    function rebuildVoiceProcessingPipeline() {
      if (!localAudioStream) {
        outboundAudioStream = null;
        stopVoiceProcessingPipeline();
        return;
      }

      stopVoiceProcessingPipeline();

      const AudioCtx = window.AudioContext || window.webkitAudioContext;

      if (!AudioCtx) {
        outboundAudioStream = localAudioStream;
        return;
      }

      voiceProcessingContext = new AudioCtx();

      const source = voiceProcessingContext.createMediaStreamSource(localAudioStream);
      const inputGain = voiceProcessingContext.createGain();
      inputGain.gain.value = getInputGainValue();
      const highpass = voiceProcessingContext.createBiquadFilter();
      highpass.type = "highpass";
      highpass.frequency.value = 120;

      const compressor = voiceProcessingContext.createDynamicsCompressor();
      compressor.threshold.value = -45;
      compressor.knee.value = 25;
      compressor.ratio.value = 8;
      compressor.attack.value = 0.003;
      compressor.release.value = 0.2;

      const analyser = voiceProcessingContext.createAnalyser();
      analyser.fftSize = 512;

      const gate = voiceProcessingContext.createGain();
      gate.gain.value = 1;

      const destination = voiceProcessingContext.createMediaStreamDestination();

      source.connect(inputGain);
      if (isNoiseSuppressionEnabled) {
        inputGain.connect(highpass);
        highpass.connect(compressor);
        compressor.connect(analyser);
        analyser.connect(gate);
        gate.connect(destination);
      } else {
        inputGain.connect(destination);
      }

      voiceProcessingGateNode = gate;
      voiceProcessingInputGainNode = inputGain;

      if (isNoiseSuppressionEnabled) {
        const data = new Uint8Array(analyser.fftSize);
        voiceProcessingIntervalId = setInterval(() => {
          if (!voiceProcessingGateNode) {
            return;
          }

          analyser.getByteTimeDomainData(data);

          let sum = 0;
          for (let i = 0; i < data.length; i += 1) {
            const normalized = (data[i] - 128) / 128;
            sum += normalized * normalized;
          }

          const rms = Math.sqrt(sum / data.length);
          const target = rms < 0.014 ? 0.05 : 1;
          voiceProcessingGateNode.gain.setTargetAtTime(target, voiceProcessingContext.currentTime, 0.03);
        }, 50);
      }

      outboundAudioStream = destination.stream;
    }

    async function applyNoiseSuppressionToCurrentStream() {
      if (!localAudioStream) {
        return;
      }

      const [track] = localAudioStream.getAudioTracks();

      if (!track || typeof track.applyConstraints !== "function") {
        return;
      }

      try {
        await track.applyConstraints(buildAudioConstraints());
      } catch (_err) {
      }

      rebuildVoiceProcessingPipeline();
    }

    async function toggleNoiseSuppression() {
      isNoiseSuppressionEnabled = !isNoiseSuppressionEnabled;
      localStorage.setItem(NOISE_SUPPRESSION_KEY, isNoiseSuppressionEnabled ? "1" : "0");

      await applyNoiseSuppressionToCurrentStream();

    function playVoiceJoinSound() {
      playVoiceCue({ startFreq: 740, endFreq: 980, duration: 0.15, type: "triangle", gainPeak: 0.06 });
    }

    function playVoiceMuteSound() {
      playVoiceCue({ startFreq: 540, endFreq: 430, duration: 0.12, type: "square", gainPeak: 0.045 });
    }

    function playVoiceUnmuteSound() {
      playVoiceCue({ startFreq: 430, endFreq: 620, duration: 0.12, type: "sine", gainPeak: 0.05 });
    }

    function playVoiceDeafenSound() {
      playVoiceCue({ startFreq: 360, endFreq: 300, duration: 0.14, type: "sawtooth", gainPeak: 0.04 });
    }

    function playVoiceUndeafenSound() {
      playVoiceCue({ startFreq: 300, endFreq: 460, duration: 0.14, type: "triangle", gainPeak: 0.045 });
    }

    function playVoiceLeaveSound() {
      playVoiceCue({ startFreq: 660, endFreq: 390, duration: 0.16, type: "triangle", gainPeak: 0.05 });
    }

    function playVoiceCue({ startFreq, endFreq, duration, type, gainPeak }) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;

      if (!AudioCtx) {
        return;
      }

      const context = new AudioCtx();
      const oscillator = context.createOscillator();
      const gain = context.createGain();

      oscillator.type = type || "triangle";
      oscillator.frequency.setValueAtTime(startFreq, context.currentTime);
      oscillator.frequency.linearRampToValueAtTime(endFreq, context.currentTime + duration * 0.8);

      gain.gain.setValueAtTime(0.0001, context.currentTime);
      gain.gain.exponentialRampToValueAtTime(gainPeak || 0.05, context.currentTime + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + duration);

      oscillator.connect(gain);
      gain.connect(context.destination);

      oscillator.start();
      oscillator.stop(context.currentTime + duration + 0.01);
      oscillator.onended = () => {
        context.close().catch(() => {});
      };
    }

    function pushVoiceActivity(text) {
      if (!text) {
        return;
      }

      // Lista de atividade removida da UI; mantemos apenas cache interno.
      if (!voiceActivityMessages) {
        return;
      }

      const timestamp = new Intl.DateTimeFormat("pt-BR", {
        hour: "2-digit",
        minute: "2-digit"
      }).format(new Date());

      voiceActivityMessages.unshift(`${timestamp} - ${text}`);

      if (voiceActivityMessages.length > 5) {
        voiceActivityMessages.length = 5;
      }

    }

    function normalizeVoicePresenceRows(payload) {
      const normalized = new Map();
      const rows = Array.isArray(payload?.channels) ? payload.channels : [];

      rows.forEach((entry) => {
        const channelId = Number.parseInt(entry.channelId, 10);

        if (!Number.isFinite(channelId) || channelId <= 0) {
          return;
        }

        const participants = Array.isArray(entry.participants)
          ? entry.participants.map((participant) => ({
            username: String(participant?.username || "Usuario"),
            muted: Boolean(participant?.muted),
            speaking: Boolean(participant?.speaking),
            deafened: Boolean(participant?.deafened)
          }))
          : [];

        normalized.set(channelId, participants);
      });

      return normalized;
    }

    function applyVoicePresence(payload, announceChanges = false) {
      const nextPresence = normalizeVoicePresenceRows(payload);

      if (announceChanges) {
        for (const [channelId, nextUsers] of nextPresence.entries()) {
          const previousUsers = voiceChannelsPresence.get(channelId) || [];
          const prevNames = new Set(previousUsers.map((participant) => participant.username));
          const current = channels.find((channel) => channel.id === channelId);

          nextUsers.forEach((participant) => {
            if (!prevNames.has(participant.username)) {
              pushVoiceActivity(`${participant.username} entrou em call em #${current?.name || channelId}`);
            }
          });
        }
      }

      voiceChannelsPresence.clear();

      for (const [channelId, participants] of nextPresence.entries()) {
        voiceChannelsPresence.set(channelId, participants);
      }

      renderVoiceChannels();
    }

    function syncCurrentVoiceChannelPresence() {
      if (!voiceJoinedChannelId) {
        return;
      }

      voiceChannelsPresence.set(
        voiceJoinedChannelId,
        Array.from(voiceParticipantsState.values()).map((participant) => ({
          username: participant.username,
          muted: participant.muted,
          speaking: participant.speaking,
          deafened: participant.deafened
        }))
      );

      renderVoiceChannels();
    }

    function upsertVoiceParticipant(id, payload = {}) {
      if (!id) {
        return;
      }

      const previous = voiceParticipantsState.get(id) || {};
      voiceParticipantsState.set(id, {
        username: payload.username || previous.username || "Usuario",
        muted: payload.muted !== undefined ? Boolean(payload.muted) : Boolean(previous.muted),
        speaking: payload.speaking !== undefined ? Boolean(payload.speaking) : Boolean(previous.speaking),
        deafened: payload.deafened !== undefined ? Boolean(payload.deafened) : Boolean(previous.deafened),
        local: payload.local !== undefined ? Boolean(payload.local) : Boolean(previous.local)
      });
    }

    function renderVoiceParticipants() {
      return;
    }

        : "";

    function removeRemoteAudio(socketId) {
      destroyRemoteAudioPipeline(socketId);
      const audio = document.getElementById(`voice-audio-${socketId}`);

      if (audio) {
        audio.srcObject = null;
        audio.remove();
      }
    }

    function closePeerConnection(socketId) {
      const peer = peerConnections.get(socketId);

      if (peer) {
        peer.onicecandidate = null;
        peer.ontrack = null;
        peer.close();
      }

      peerConnections.delete(socketId);
      removeRemoteAudio(socketId);
    }

    async function ensureVoiceSocket() {
      if (voiceSocket && voiceSocket.connected) {
        return;
      }

      voiceSocket = io({
        auth: {
          token: authToken
        }
      });

      voiceSocket.on("connect", () => {
        voiceSocketId = String(voiceSocket.id || "");
      });

      voiceSocket.on("voice:error", ({ error }) => {
        displayVoiceError(error || "Falha no canal de voz");
      });

      voiceSocket.on("voice:participants", async ({ participants }) => {
        voiceParticipantsState.clear();
        upsertVoiceParticipant("self", {
          username: userName,
          muted: isMuted,
          speaking: localSpeakingState,
          deafened: isDeafened,
          local: true
        });

        for (const participant of participants || []) {
          upsertVoiceParticipant(participant.socketId, {
            username: participant.username,
            muted: participant.muted,
            speaking: participant.speaking,
            deafened: participant.deafened
          });
          await createPeerConnection(participant.socketId, true);
        }

        syncCurrentVoiceChannelPresence();
        renderVoiceParticipants();
      });

      voiceSocket.on("voice:user-joined", ({ socketId, username, muted, speaking, deafened }) => {
        if (!voiceJoinedChannelId) {
          return;
        }

        upsertVoiceParticipant(socketId, { username, muted, speaking, deafened });
        pushVoiceActivity(`${username || "Usuario"} entrou em call`);
        syncCurrentVoiceChannelPresence();
        renderVoiceParticipants();

        createPeerConnection(socketId, false).catch(() => {});
      });

      voiceSocket.on("voice:user-left", ({ socketId }) => {
        closePeerConnection(socketId);
        voiceParticipantsState.delete(socketId);
        syncCurrentVoiceChannelPresence();
        renderVoiceParticipants();
      });

      voiceSocket.on("voice:user-muted", ({ socketId, muted }) => {
        const participantId = socketId === voiceSocketId ? "self" : socketId;
        upsertVoiceParticipant(participantId, { muted });
        syncCurrentVoiceChannelPresence();
        renderVoiceParticipants();
      });

      voiceSocket.on("voice:user-deafened", ({ socketId, deafened }) => {
        const participantId = socketId === voiceSocketId ? "self" : socketId;
        upsertVoiceParticipant(participantId, { deafened });
        syncCurrentVoiceChannelPresence();
        renderVoiceParticipants();
      });

      voiceSocket.on("voice:user-speaking", ({ socketId, speaking }) => {
        const participantId = socketId === voiceSocketId ? "self" : socketId;
        upsertVoiceParticipant(participantId, { speaking });
        renderVoiceParticipants();
      });

      voiceSocket.on("voice:signal", async ({ from, data }) => {
        if (!from || !data) {
          return;
        }

        const peer = await createPeerConnection(from, false);

        if (data.type === "offer") {
          await peer.setRemoteDescription(new RTCSessionDescription(data));
          const answer = await peer.createAnswer();
          await peer.setLocalDescription(answer);
          voiceSocket.emit("voice:signal", { to: from, data: answer });
          return;
        }

        if (data.type === "answer") {
          await peer.setRemoteDescription(new RTCSessionDescription(data));
          return;
        }

        if (data.candidate) {
          await peer.addIceCandidate(new RTCIceCandidate(data));
        }
      });

      voiceSocket.on("disconnect", () => {
        for (const socketId of peerConnections.keys()) {
          closePeerConnection(socketId);
        }

        stopLocalSpeakingMonitor();
        voiceJoinedChannelId = null;
        isMuted = false;
        isDeafened = false;
        voiceParticipantsState.clear();
        voiceSocketId = "";
        stopVoiceLatencyMonitor();
        updateVoiceUi();
        renderVoiceParticipants();
      });
    }

    function stopLocalSpeakingMonitor() {
      if (localSpeakingIntervalId) {
        clearInterval(localSpeakingIntervalId);
        localSpeakingIntervalId = null;
      }

      localAudioAnalyser = null;

      if (localAudioContext) {
        localAudioContext.close().catch(() => {});
        localAudioContext = null;
      }

      localSpeakingState = false;
    }

    async function refreshPeerOutboundTrack() {
      const nextTrack = (outboundAudioStream || localAudioStream)?.getAudioTracks()?.[0] || null;

      if (!nextTrack) {
        return;
      }

      for (const peer of peerConnections.values()) {
        const sender = peer.getSenders().find((item) => item.track && item.track.kind === "audio");

        if (sender) {
          await sender.replaceTrack(nextTrack);
        }
      }
    }

    function startLocalSpeakingMonitor() {
      if (!localAudioStream || !voiceSocket || !voiceJoinedChannelId) {
        return;
      }

      stopLocalSpeakingMonitor();
      localAudioContext = new (window.AudioContext || window.webkitAudioContext)();
      const source = localAudioContext.createMediaStreamSource(localAudioStream);
      localAudioAnalyser = localAudioContext.createAnalyser();
      localAudioAnalyser.fftSize = 512;
      source.connect(localAudioAnalyser);

      const data = new Uint8Array(localAudioAnalyser.fftSize);

      localSpeakingIntervalId = setInterval(() => {
        if (!localAudioAnalyser || !voiceSocket || !voiceJoinedChannelId) {
          return;
        }

        localAudioAnalyser.getByteTimeDomainData(data);
        let sum = 0;

        for (let i = 0; i < data.length; i += 1) {
          sum += Math.abs((data[i] - 128) / 128);
        }

        const speakingNow = !isMuted && (sum / data.length) > 0.08;

        if (speakingNow === localSpeakingState) {
          return;
        }

        localSpeakingState = speakingNow;
        upsertVoiceParticipant("self", { speaking: localSpeakingState, muted: isMuted, local: true, username: userName });
        renderVoiceParticipants();
        voiceSocket.emit("voice:speaking", { speaking: speakingNow });
      }, 250);
    }

    async function createPeerConnection(targetSocketId, shouldOffer) {
      if (peerConnections.has(targetSocketId)) {
        return peerConnections.get(targetSocketId);
      }

      const peer = new RTCPeerConnection({
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
      });

      peerConnections.set(targetSocketId, peer);

      const sendStream = outboundAudioStream || localAudioStream;

      if (sendStream) {
        sendStream.getAudioTracks().forEach((track) => {
          peer.addTrack(track, sendStream);
        });
      }

      peer.onicecandidate = (event) => {
        if (!event.candidate || !voiceSocket) {
          return;
        }

        voiceSocket.emit("voice:signal", {
          to: targetSocketId,
          data: event.candidate
        });
      };

      peer.ontrack = (event) => {
        const [stream] = event.streams;

        if (!stream) {
          return;
        }

        createRemoteAudioPipeline(targetSocketId, stream);
      };

      if (shouldOffer) {
        const offer = await peer.createOffer();
        await peer.setLocalDescription(offer);
        voiceSocket.emit("voice:signal", { to: targetSocketId, data: offer });
      }

      return peer;
    }

    async function joinVoice(channelId = activeChannelId) {
      const targetChannelId = channelId;

      if (!authToken || !targetChannelId) {
        return;
      }

      if (voiceJoinedChannelId === targetChannelId) {
        return;
      }

      if (!localAudioStream) {
        localAudioStream = await navigator.mediaDevices.getUserMedia({
          audio: buildAudioConstraints()
        });
      }

      rebuildVoiceProcessingPipeline();

      await ensureVoiceSocket();

      try {
        await requestVoiceJoin(targetChannelId);
        voiceJoinedChannelId = targetChannelId;
        isMuted = false;
        isDeafened = false;
        voiceParticipantsState.clear();
        upsertVoiceParticipant("self", {
          username: userName,
          muted: false,
          speaking: false,
          deafened: false,
          local: true
        });
        playVoiceJoinSound();
        startLocalSpeakingMonitor();
        startVoiceLatencyMonitor();
        updateVoiceUi();
        renderVoiceParticipants();
        refreshVoiceChannels().catch(() => {});
      } catch (err) {
        if (!voiceJoinedChannelId && localAudioStream) {
          localAudioStream.getTracks().forEach((track) => track.stop());
          localAudioStream = null;
        }

        stopLocalSpeakingMonitor();
        throw err;
      }
    }

    async function leaveVoice() {
      if (voiceJoinedChannelId) {
        playVoiceLeaveSound();
      }

      if (voiceSocket && voiceJoinedChannelId) {
        voiceSocket.emit("voice:speaking", { speaking: false });
        voiceSocket.emit("voice:deafen", { deafened: false });
        voiceSocket.emit("voice:leave");
      }

      for (const socketId of peerConnections.keys()) {
        closePeerConnection(socketId);
      }

      if (localAudioStream) {
        localAudioStream.getTracks().forEach((track) => track.stop());
        localAudioStream = null;
      }

      stopVoiceProcessingPipeline();

      stopLocalSpeakingMonitor();
      stopVoiceLatencyMonitor();
      voiceParticipantsState.clear();

      if (voiceSocket && !authToken) {
        voiceSocket.disconnect();
        voiceSocket = null;
      }

      voiceJoinedChannelId = null;
      isMuted = false;
      isDeafened = false;
      updateVoiceUi();
      renderVoiceParticipants();
      refreshVoiceChannels().catch(() => {});
    }

    function toggleMuteVoice() {
      if (!localAudioStream) {
        return;
      }

      if (isDeafened && isMuted) {
        isDeafened = false;
        applyDeafenToRemoteAudio();

        if (voiceSocket && voiceJoinedChannelId) {
          voiceSocket.emit("voice:deafen", { deafened: false });
        }
      }

      isMuted = !isMuted;

      if (isMuted) {
        playVoiceMuteSound();
      } else {
        playVoiceUnmuteSound();
      }

      localAudioStream.getAudioTracks().forEach((track) => {
        track.enabled = !isMuted;
      });

      if (voiceSocket && voiceJoinedChannelId) {
        voiceSocket.emit("voice:mute", { muted: isMuted });
        if (isMuted) {
          localSpeakingState = false;
          voiceSocket.emit("voice:speaking", { speaking: false });
        }
      }

      upsertVoiceParticipant("self", {
        username: userName,
        muted: isMuted,
        speaking: localSpeakingState,
        deafened: isDeafened,
        local: true
      });

      updateVoiceUi();
      renderVoiceParticipants();
      refreshVoiceChannels().catch(() => {});
    }

    function applyDeafenToRemoteAudio() {
      applyOutputGainValue();
    }

    function toggleDeafenVoice() {
      if (!voiceJoinedChannelId) {
        return;
      }

      isDeafened = !isDeafened;

      if (isDeafened) {
        playVoiceDeafenSound();
      } else {
        playVoiceUndeafenSound();
      }

      applyDeafenToRemoteAudio();

      if (voiceSocket) {
        voiceSocket.emit("voice:deafen", { deafened: isDeafened });
      }

      if (isDeafened && !isMuted) {
        isMuted = true;

        if (localAudioStream) {
          localAudioStream.getAudioTracks().forEach((track) => {
            track.enabled = false;
          });
        }

        if (voiceSocket) {
          voiceSocket.emit("voice:mute", { muted: true });
          voiceSocket.emit("voice:speaking", { speaking: false });
        }

        localSpeakingState = false;
      }

      upsertVoiceParticipant("self", {
        username: userName,
        muted: isMuted,
        speaking: localSpeakingState,
        deafened: isDeafened,
        local: true
      });

      updateVoiceUi();
      renderVoiceParticipants();
      refreshVoiceChannels().catch(() => {});
    }

    async function fetchVoiceChannels() {
      const res = await authFetch("/voice/channels");

      if (!res.ok) {
        throw new Error("Falha ao carregar estado dos canais de voz");
      }

      return res.json();
    }

    async function refreshVoiceChannels() {
      if (!authToken) {
        return;
      }

      const payload = await fetchVoiceChannels();
      applyVoicePresence(payload, true);
    }

    async function authFetch(url, options = {}) {
      const headers = new Headers(options.headers || {});

      if (authToken) {
        headers.set("Authorization", `Bearer ${authToken}`);
      }

      const res = await fetch(url, { ...options, headers });

      if (res.status === 401) {
        clearSession();
        throw new Error("Sessao expirada. Entre novamente com sua chave.");
      }

      return res;
    }

    function buildMessagesUrl(params = {}) {
      const url = new URL("/messages", window.location.origin);
      const merged = {
        channelId: activeChannelId || 1,
        ...params
      };

      Object.entries(merged).forEach(([key, value]) => {
        if (value !== null && value !== undefined) {
          url.searchParams.set(key, String(value));
        }
      });

      return `${url.pathname}${url.search}`;
    }

    function sanitizeChannelName(value) {
      return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "-")
        .replace(/[^a-z0-9_-]/g, "")
        .slice(0, 30);
    }

    function updateCurrentChannelTitle() {
      const current = channels.find((channel) => channel.id === activeChannelId);
      currentChannelTitle.textContent = current ? `# ${current.name}` : "# geral";
    }

    function renderChannels() {
      channelsList.innerHTML = "";

      channels.forEach((channel) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `channel-item${channel.id === activeChannelId ? " is-active" : ""}`;
        button.textContent = `# ${channel.name}`;

        button.addEventListener("click", () => {
          if (activeChannelId === channel.id) {
            return;
          }

          stopTyping().catch(() => {});

          activeChannelId = channel.id;
          updateCurrentChannelTitle();
          renderChannels();
          resetChatState();
          loadInitialMessages().catch(() => {});
          refreshTyping().catch(() => {});
          closeSidebar();
        });

        channelsList.appendChild(button);
      });

      renderVoiceChannels();
    }

    function renderVoiceChannels() {
      voiceChannelsList.innerHTML = "";
      const channel = {
        id: FIXED_VOICE_CHANNEL_ID,
        name: FIXED_VOICE_CHANNEL_NAME
      };

      const wrapper = document.createElement("div");
      wrapper.className = "voice-channel-entry";

      const button = document.createElement("button");
      button.type = "button";
      button.className = `channel-item voice-channel-item${channel.id === voiceJoinedChannelId ? " is-voice-active" : ""}`;
      button.textContent = `# ${channel.name}`;

      button.addEventListener("click", async () => {
        try {
          if (voiceJoinedChannelId === channel.id) {
            await leaveVoice();
            return;
          }

          await joinVoice(channel.id);
          closeSidebar();
        } catch (err) {
          displayVoiceError(err?.message || "Nao foi possivel entrar no canal de voz");
        }
      });

      const users = voiceChannelsPresence.get(channel.id) || [];
      const usersList = document.createElement("div");
      usersList.className = "voice-channel-users";

      if (users.length === 0) {
        usersList.innerHTML = "<div class=\"voice-channel-user is-empty\">vazio</div>";
      } else {
        users.forEach((participant) => {
          const user = document.createElement("div");
          user.className = "voice-channel-user";

          if (participant.muted) {
            user.classList.add("is-muted");
          }

          const tags = [];
          if (participant.muted) {
            tags.push("mutado");
          }

          if (participant.deafened) {
            tags.push("sem audio");
          }

          if (participant.speaking) {
            tags.push("falando");
          }

          user.textContent = tags.length > 0
            ? `${participant.username} (${tags.join(", ")})`
            : participant.username;
          usersList.appendChild(user);
        });
      }

      wrapper.appendChild(button);
      wrapper.appendChild(usersList);
      voiceChannelsList.appendChild(wrapper);
    }

    async function fetchChannels() {
      const res = await authFetch("/channels");

      if (!res.ok) {
        throw new Error("Falha ao carregar canais");
      }

      return res.json();
    }

    async function loadChannels() {
      const data = await fetchChannels();
      channels = Array.isArray(data) ? data : [];

      if (channels.length === 0) {
        throw new Error("Nenhum canal encontrado");
      }

      const stillExists = channels.some((channel) => channel.id === activeChannelId);

      if (!stillExists) {
        activeChannelId = channels[0].id;
      }

      updateCurrentChannelTitle();
      renderChannels();
      await refreshVoiceChannels();
    }

    async function createChannel(name) {
      const channelName = sanitizeChannelName(name);

      if (!channelName || channelName.length < 2) {
        throw new Error("Nome do canal invalido");
      }

      const res = await authFetch("/channels", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: channelName })
      });

      let payload = {};
      try {
        payload = await res.json();
      } catch (_err) {
        payload = {};
      }

      if (!res.ok) {
        throw new Error(payload.error || "Falha ao criar canal");
      }

      await loadChannels();
      activeChannelId = payload.id;
      updateCurrentChannelTitle();
      renderChannels();
      resetChatState();
      await loadInitialMessages();
    }

    async function fetchPresence() {
      const res = await authFetch("/presence");

      if (!res.ok) {
        throw new Error("Falha ao carregar presenca");
      }

      return res.json();
    }

    async function fetchTyping() {
      const url = new URL("/typing", window.location.origin);
      url.searchParams.set("channelId", String(activeChannelId || 1));

      const res = await authFetch(`${url.pathname}${url.search}`);

      if (!res.ok) {
        throw new Error("Falha ao carregar digitando");
      }

      return res.json();
    }

    function renderPresence(payload) {
      const users = Array.isArray(payload?.users) ? payload.users : [];
      const details = Array.isArray(payload?.details) ? payload.details : [];
      onlineStatus.textContent = `${users.length} online`;
      onlineStatus.title = users.length > 0
        ? details.map((row) => `${row.username} (ativo ha ${formatAgo(row.lastSeenAgoMs)})`).join(", ")
        : "Nenhum usuario online";
    }

    function renderTyping(payload) {
      const users = Array.isArray(payload?.users)
        ? payload.users.filter((name) => name !== userName)
        : [];

      if (users.length === 0) {
        typingIndicator.textContent = "";
        return;
      }

      if (users.length === 1) {
        typingIndicator.textContent = `${users[0]} esta digitando...`;
        return;
      }

      if (users.length === 2) {
        typingIndicator.textContent = `${users[0]} e ${users[1]} estao digitando...`;
        return;
      }

      typingIndicator.textContent = `${users[0]}, ${users[1]} e mais ${users.length - 2} estao digitando...`;
    }

    async function refreshPresence() {
      if (!authToken) {
        return;
      }

      const payload = await fetchPresence();
      renderPresence(payload);
    }

    async function refreshTyping() {
      if (!authToken || !activeChannelId) {
        return;
      }

      const payload = await fetchTyping();
      renderTyping(payload);
    }

    async function startTyping() {
      if (!authToken || !activeChannelId || isTyping) {
        return;
      }

      isTyping = true;

      try {
        await authFetch("/typing/start", {

      }

      isTyping = false;

      try {
        await authFetch("/typing/stop", {
          method: "POST",
          headers: { "Content-Type": "application/json" },

        });
      } catch (_err) {
      }
    }

    function updateBoundaries(message) {
      if (oldestMessageId === null || message.id < oldestMessageId) {
        oldestMessageId = message.id;
      }

      if (newestMessageId === null || message.id > newestMessageId) {
        newestMessageId = message.id;
      }
    }

    function parseServerDate(value) {
      if (!value) {
        return null;
      }

      const raw = String(value).trim();
      const normalized = raw.includes("T") ? raw : `${raw.replace(" ", "T")}Z`;
      const parsed = new Date(normalized);

      if (!Number.isFinite(parsed.getTime())) {
        return null;
      }

      return parsed;
    }

    function formatMessageTimestamp(value) {
      const date = parseServerDate(value);

      if (!date) {
        return "";
      }

      return new Intl.DateTimeFormat("pt-BR", {
        day: "2-digit",
        month: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }).format(date);
    }

    function formatAgo(ms) {
      const value = Number(ms || 0);

      if (!Number.isFinite(value) || value < 1000) {
        return "agora";
      }

      const seconds = Math.floor(value / 1000);

      if (seconds < 60) {
        return `${seconds}s`;
      }

      const minutes = Math.floor(seconds / 60);

      if (minutes < 60) {
        return `${minutes}min`;
      }

      const hours = Math.floor(minutes / 60);
      return `${hours}h`;
    }

    function isAvatarImageSource(value) {
      const source = String(value || "").trim();

      if (!source) {
        return false;
      }

      return /^(https?:\/\/|\/|data:image\/)/i.test(source);
    }

    function getAvatarLabel(value, fallbackName) {
      const raw = String(value || "").trim();

      if (raw && !isAvatarImageSource(raw)) {
        return raw.slice(0, 2).toUpperCase();
      }

      const safeName = String(fallbackName || "?").trim();
      return (safeName.slice(0, 1) || "?").toUpperCase();
    }

    function setReplyContext(message) {
      replyingToMessage = message || null;

      if (!replyingToMessage) {
        replyContext.hidden = true;
        replyContextText.textContent = "";
        return;
      }

      const previewText = String(replyingToMessage.text || "").trim();
      const shortPreview = previewText.length > 70 ? `${previewText.slice(0, 67)}...` : previewText;
      replyContextText.textContent = `Respondendo ${replyingToMessage.name || "Anonimo"}: ${shortPreview || "(anexo)"}`;
      replyContext.hidden = false;
    }

    function setUploadProgress(percent) {
      if (!Number.isFinite(percent) || percent <= 0) {
        uploadProgressBar.style.width = "0%";
        uploadProgress.style.opacity = "0";
        uploadProgress.style.pointerEvents = "none";
        return;
      }

      uploadProgress.style.opacity = "1";
      uploadProgress.style.pointerEvents = "auto";
      uploadProgressBar.style.width = `${Math.min(100, Math.max(0, percent))}%`;
    }

      const res = await authFetch("/profile/me");

    async function saveMyProfile(nextProfile) {
      const res = await authFetch("/profile/me", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(nextProfile)
      });

      let payload = {};

      try {
        payload = await res.json();
      } catch (_err) {
        payload = {};
      }

      if (!res.ok) {
        throw new Error(payload.error || "Falha ao salvar perfil");
      }

      profileMe = payload;
      profileByUsername.set(userName, payload);
      return payload;
    }

    async function ensureProfilesForMessages(messages) {
      const names = Array.from(
        new Set(
          (messages || [])
            .map((message) => String(message?.name || "").trim())
            .filter(Boolean)
            .filter((name) => !profileByUsername.has(name))
        )
      );

      if (names.length === 0) {
        return;
      }

      const url = new URL("/profiles", window.location.origin);
      url.searchParams.set("usernames", names.join(","));
      const res = await authFetch(`${url.pathname}${url.search}`);

      if (!res.ok) {
        return;
      }

      const rows = await res.json();

      (rows || []).forEach((profile) => {
        if (profile?.username) {
          profileByUsername.set(profile.username, profile);
        }
      });
    }

    function applyMessageVisibilityFilter() {
      const query = messageSearchQuery;
      const rows = chat.querySelectorAll(".chat-message");

      rows.forEach((row) => {
        if (!query) {
          row.hidden = false;
          return;
        }

        const text = String(row.dataset.searchText || "");
        row.hidden = !text.includes(query);
      });
    }

    function maybeRequestNotificationPermission() {
      if (notificationPermissionAsked || !("Notification" in window)) {
        return;
      }

      notificationPermissionAsked = true;

      if (Notification.permission === "default") {
        Notification.requestPermission().catch(() => {});
      }
    }

    function maybeNotifyMessage(message) {
      if (!("Notification" in window) || Notification.permission !== "granted") {
        return;
      }

      if (document.visibilityState === "visible") {
        return;
      }

      if (!message || message.name === userName) {
        return;
      }

      const text = String(message.text || "").trim();
      const mentionsMe = text.toLowerCase().includes(userName.toLowerCase());

      if (!mentionsMe && !text) {
        return;
      }

      const title = mentionsMe ? `Mencao de ${message.name}` : `Nova mensagem de ${message.name}`;
      const body = text || "Enviou um anexo";

      try {
        new Notification(title, { body, tag: `chat-msg-${message.id}` });
      } catch (_err) {
      }
    }

    function updateVoiceLatencyUi() {
      if (!voiceJoinedChannelId) {
        voiceState.textContent = "Sem voz";
        return;
      }

      const currentName = voiceJoinedChannelId === FIXED_VOICE_CHANNEL_ID
        ? FIXED_VOICE_CHANNEL_NAME
        : "canal-voz";
      const compactChannelName = currentName.trim().toLowerCase().replace(/\s+/g, "-");
      const latencyLabel = Number.isFinite(voiceLatencyMs) ? `${voiceLatencyMs}ms` : "--ms";

      voiceState.textContent = `#${compactChannelName} ${latencyLabel}`;
    }

    function stopVoiceLatencyMonitor() {
      if (voiceLatencyIntervalId) {
        clearInterval(voiceLatencyIntervalId);
        voiceLatencyIntervalId = null;
      }

      voiceLatencyMs = null;
      updateVoiceLatencyUi();
    }

    function startVoiceLatencyMonitor() {
      stopVoiceLatencyMonitor();

      if (!voiceJoinedChannelId || !voiceSocket) {
        return;
      }

      const measure = () => {
        if (!voiceSocket || !voiceJoinedChannelId) {
          return;
        }

        const startedAt = Date.now();

        voiceSocket.emit("voice:latency:ping", { sentAt: startedAt }, () => {
          voiceLatencyMs = Date.now() - startedAt;
          updateVoiceLatencyUi();
        });
      };

      measure();
      voiceLatencyIntervalId = setInterval(measure, 3500);
    }

      if (!secret) {

      }

      adminSecret = secret;

      const res = await fetch(path, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-admin-secret": secret
        },
        body: JSON.stringify(payload)
      });

      let responsePayload = {};

      try {

      } catch (_err) {
        responsePayload = {};

      return responsePayload;

    function renderMessage(message, position = "bottom") {
      if (loadedMessageIds.has(message.id)) {
        return;
      }

      const div = document.createElement("div");
      div.className = "chat-message";
      div.dataset.messageId = String(message.id);

      const authorName = String(message.name || "Anonimo");
      const profile = profileByUsername.get(authorName) || null;

      const meta = document.createElement("div");
      meta.className = "chat-meta";

      const avatar = document.createElement("span");
      avatar.className = "chat-avatar";
      const avatarSource = String(profile?.avatarUrl || "").trim();
      const avatarLabel = getAvatarLabel(avatarSource, authorName);

      if (isAvatarImageSource(avatarSource)) {
        const avatarImage = document.createElement("img");
        avatarImage.className = "chat-avatar-image";
        avatarImage.src = avatarSource;
        avatarImage.alt = `Avatar de ${authorName}`;
        avatarImage.loading = "lazy";
        avatarImage.addEventListener("error", () => {
          avatarImage.remove();
          avatar.classList.add("is-fallback");
          avatar.textContent = avatarLabel;
        });
        avatar.appendChild(avatarImage);
      } else {
        avatar.classList.add("is-fallback");
        avatar.textContent = avatarLabel;
      }

      meta.appendChild(avatar);

      const author = document.createElement("strong");
      author.className = "chat-author";
      author.textContent = authorName;

      if (profile?.nameColor) {
        author.style.color = profile.nameColor;
      }

      meta.appendChild(author);

      const time = document.createElement("span");
      time.className = "chat-time";
      time.textContent = formatMessageTimestamp(message.created_at);
      meta.appendChild(time);

      if (message.edited_at) {
        const editedTag = document.createElement("span");
        editedTag.className = "chat-edited-tag";
        editedTag.textContent = "editado";
        meta.appendChild(editedTag);
      }

      const actions = document.createElement("div");
      actions.className = "chat-actions";

      const replyButton = document.createElement("button");
      replyButton.type = "button";
      replyButton.className = "chat-action-button";
      replyButton.textContent = "↩";
      replyButton.title = "Responder";
      replyButton.setAttribute("aria-label", "Responder");
      replyButton.addEventListener("click", () => {
        setReplyContext(message);
        messageInput.focus();
      });
      actions.appendChild(replyButton);

      if (authorName === userName) {
        const editButton = document.createElement("button");
        editButton.type = "button";
        editButton.className = "chat-action-button";
        editButton.textContent = "✎";
        editButton.title = "Editar";
        editButton.setAttribute("aria-label", "Editar");
        editButton.addEventListener("click", async () => {
          const nextText = prompt("Editar mensagem:", message.text || "");

          if (nextText === null) {
            return;
          }

          const trimmed = nextText.trim();

          if (!trimmed) {
            alert("Mensagem vazia nao e valida");
            return;
          }

          try {
            const res = await authFetch(`/messages/${message.id}`, {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ text: trimmed })
            });

            if (!res.ok) {
              throw new Error("Falha ao editar mensagem");
            }

            resetChatState();
            await loadInitialMessages();
          } catch (err) {
            alert(err.message || "Falha ao editar");
          }
        });
        actions.appendChild(editButton);

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "chat-action-button danger";
        deleteButton.textContent = "🗑";
        deleteButton.title = "Excluir";
        deleteButton.setAttribute("aria-label", "Excluir");
        deleteButton.addEventListener("click", async () => {
          const confirmed = confirm("Excluir esta mensagem?");

          if (!confirmed) {
            return;
          }

          try {
            const res = await authFetch(`/messages/${message.id}`, {
              method: "DELETE"
            });

            if (!res.ok) {
              throw new Error("Falha ao excluir mensagem");
            }

            resetChatState();
            await loadInitialMessages();
          } catch (err) {
            alert(err.message || "Falha ao excluir");
          }
        });
        actions.appendChild(deleteButton);
      }

      meta.appendChild(actions);

      div.appendChild(meta);

      if (message.reply_to_id) {
        const replyPreview = document.createElement("div");
        replyPreview.className = "chat-reply-preview";
        const repliedName = message.reply_name || "Mensagem";
        const repliedText = String(message.reply_text || "(anexo ou mensagem removida)").trim();
        const shortReply = repliedText.length > 90 ? `${repliedText.slice(0, 87)}...` : repliedText;
        replyPreview.textContent = `↳ ${repliedName}: ${shortReply}`;
        div.appendChild(replyPreview);
      }

      if (message.text) {
        const text = document.createElement("span");
        text.textContent = message.text;
        div.appendChild(text);
      }

      const attachmentElement = buildAttachmentElement(message);

      if (attachmentElement) {
        div.appendChild(attachmentElement);
      }

      if (position === "top") {
        chat.prepend(div);
      } else {
        chat.appendChild(div);
      }

      div.dataset.searchText = [authorName, message.text || "", message.reply_text || ""].join(" ").toLowerCase();
      if (notificationsArmed) {
        maybeNotifyMessage(message);
      }
      applyMessageVisibilityFilter();

      loadedMessageIds.add(message.id);
      updateBoundaries(message);
    }

    function buildAttachmentElement(message) {
      if (!message.file_url) {
        return null;
      }

      const mime = String(message.file_mime || "").toLowerCase();
      const url = message.file_url;
      const safeName = message.file_name || "arquivo";

      if (mime.startsWith("image/")) {
        const img = document.createElement("img");
        img.className = "chat-attachment chat-image";
        img.src = url;
        img.alt = safeName;
        img.loading = "lazy";
        return img;
      }

      if (mime.startsWith("video/")) {
        const video = document.createElement("video");
        video.className = "chat-attachment chat-video";
        video.src = url;
        video.controls = true;
        video.preload = "metadata";
        return video;
      }

      const fileLink = document.createElement("a");
      fileLink.className = "chat-attachment chat-file";
      fileLink.href = url;
      fileLink.target = "_blank";
      fileLink.rel = "noopener noreferrer";
      fileLink.textContent = `Arquivo: ${safeName}`;
      return fileLink;
    }

    function formatBytes(bytes) {
      const value = Number(bytes || 0);

      if (!Number.isFinite(value) || value <= 0) {
        return "0 B";
      }

      const units = ["B", "KB", "MB", "GB"];
      const exp = Math.min(Math.floor(Math.log(value) / Math.log(1024)), units.length - 1);
      const size = value / (1024 ** exp);
      return `${size.toFixed(size >= 10 || exp === 0 ? 0 : 1)} ${units[exp]}`;
    }

    function clearPreview() {
      previewArea.innerHTML = "";
      selectedFile = null;
      fileInput.value = "";

      if (selectedFileObjectUrl) {
        URL.revokeObjectURL(selectedFileObjectUrl);

    function showFilePreview(file) {
      clearPreview();
      selectedFile = file;

      const wrapper = document.createElement("div");
      wrapper.className = "preview-card";

      const title = document.createElement("div");
      title.className = "preview-title";
      title.textContent = `${file.name} (${formatBytes(file.size)})`;
      wrapper.appendChild(title);

      if (file.type.startsWith("image/")) {
        selectedFileObjectUrl = URL.createObjectURL(file);
        const image = document.createElement("img");
        image.src = selectedFileObjectUrl;
        image.alt = file.name;
        image.className = "preview-media";
        wrapper.appendChild(image);
      } else if (file.type.startsWith("video/")) {
        selectedFileObjectUrl = URL.createObjectURL(file);
        const video = document.createElement("video");
        video.src = selectedFileObjectUrl;
        video.controls = true;
        video.preload = "metadata";
        video.className = "preview-media";
        wrapper.appendChild(video);
      }

      const removeButton = document.createElement("button");
      removeButton.type = "button";
      removeButton.className = "remove-preview-button";
      removeButton.textContent = "Remover anexo";
      removeButton.addEventListener("click", clearPreview);
      wrapper.appendChild(removeButton);

      previewArea.appendChild(wrapper);
    }

    async function fetchMessages(params = {}) {
      const res = await authFetch(buildMessagesUrl(params));

      if (!res.ok) {
        throw new Error("Falha ao buscar mensagens");
      }

      return res.json();
    }

    async function loadInitialMessages() {
      const data = await fetchMessages({ limit: PAGE_SIZE });
      await ensureProfilesForMessages(data);
      data.forEach((message) => renderMessage(message, "bottom"));
      hasMoreOlderMessages = data.length === PAGE_SIZE;
      chat.scrollTop = chat.scrollHeight;
      notificationsArmed = true;
    }

    async function loadOlderMessages() {
      if (!hasMoreOlderMessages || oldestMessageId === null || isLoadingOlderMessages) {
        return;
      }

      isLoadingOlderMessages = true;
      const previousHeight = chat.scrollHeight;
      const previousTop = chat.scrollTop;

      try {
        const data = await fetchMessages({ beforeId: oldestMessageId, limit: PAGE_SIZE });
        await ensureProfilesForMessages(data);

        for (let i = data.length - 1; i >= 0; i -= 1) {
          renderMessage(data[i], "top");
        }

        hasMoreOlderMessages = data.length === PAGE_SIZE;
        chat.scrollTop = chat.scrollHeight - previousHeight + previousTop;
      } finally {
        isLoadingOlderMessages = false;
      }
    }

    async function loadNewMessages() {
      if (newestMessageId === null || !authToken || isLoadingNewMessages) {
        return;
      }

      isLoadingNewMessages = true;

      try {
        const shouldStickToBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 24;
        const data = await fetchMessages({ afterId: newestMessageId, limit: PAGE_SIZE });
        await ensureProfilesForMessages(data);
        data.forEach((message) => renderMessage(message, "bottom"));

        if (shouldStickToBottom && data.length > 0) {
          chat.scrollTop = chat.scrollHeight;

          requestAnimationFrame(() => {
            chat.scrollTop = chat.scrollHeight;
          });
        }
      } finally {
        isLoadingNewMessages = false;
      }
    }

    async function send() {
      if (isSendingMessage || !authToken) {
        return;
      }

      const input = document.getElementById("messageInput");
      const text = input.value.trim();

      if (!text && !selectedFile) {
        return;
      }

      isSendingMessage = true;
      sendButton.disabled = true;
      setUploadProgress(0);

      try {
        const formData = new FormData();
        formData.append("channelId", String(activeChannelId || 1));

        if (text) {
          formData.append("text", text);
        }

        if (selectedFile) {
          formData.append("file", selectedFile);
        }

        if (replyingToMessage?.id) {
          formData.append("replyToId", String(replyingToMessage.id));
        }

        await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open("POST", "/messages", true);
          xhr.setRequestHeader("Authorization", `Bearer ${authToken}`);

          xhr.upload.addEventListener("progress", (event) => {
            if (!event.lengthComputable) {
              return;
            }

            const percent = Math.round((event.loaded / event.total) * 100);
            setUploadProgress(percent);
          });

          xhr.addEventListener("load", () => {
            setUploadProgress(100);

            if (xhr.status >= 200 && xhr.status < 300) {
              resolve();
              return;
            }

            if (xhr.status === 401) {
              clearSession();
            }

            reject(new Error(xhr.responseText || "Falha ao enviar mensagem"));
          });

          xhr.addEventListener("error", () => {
            reject(new Error("Falha de rede ao enviar mensagem"));
          });

          xhr.send(formData);
        });

        const shouldStickToBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 30;

        input.value = "";
        clearPreview();
        setReplyContext(null);

        if (shouldStickToBottom) {
          stickChatToBottom();
        }

        if (newestMessageId === null) {
          await loadInitialMessages();
        } else {
          await loadNewMessages();
        }

        if (shouldStickToBottom) {
          stickChatToBottom();
        }
      } finally {
        setTimeout(() => setUploadProgress(0), 500);
        isSendingMessage = false;
        sendButton.disabled = false;
      }
    }

          reason: adminReasonInput.value.trim()
        });
        adminFeedback.textContent = `Mute ativo para ${payload.username} ate ${formatMessageTimestamp(payload.expiresAt)}`;
        await refreshAdminActivity();
      } catch (err) {
        adminFeedback.textContent = err.message || "Falha ao mutar";
      }
    });

    adminUnbanButton.addEventListener("click", async () => {
      try {
        const payload = await adminFetch("/admin/mod/unban", {
          username: adminTargetInput.value.trim()
        });
        adminFeedback.textContent = payload.removed ? "Ban removido" : "Nenhum ban ativo para o usuario";
        await refreshAdminActivity();
      } catch (err) {
        adminFeedback.textContent = err.message || "Falha ao remover ban";
      }
    });

    adminUnmuteButton.addEventListener("click", async () => {
      try {
        const payload = await adminFetch("/admin/mod/unmute", {
          username: adminTargetInput.value.trim()
        });
        adminFeedback.textContent = payload.removed ? "Mute removido" : "Nenhum mute ativo para o usuario";
        await refreshAdminActivity();
      } catch (err) {
        adminFeedback.textContent = err.message || "Falha ao remover mute";
      }
    });

    adminClearChannelButton.addEventListener("click", async () => {
      const confirmed = confirm("Limpar todas as mensagens deste canal?");

      if (!confirmed) {
        return;
      }

      try {
        const payload = await adminFetch("/admin/mod/clear-channel", {
          channelId: activeChannelId || 1
        });
        adminFeedback.textContent = `Canal limpo (${payload.deletedMessages} mensagens removidas)`;
        resetChatState();
        await loadInitialMessages();
        await refreshAdminActivity();
      } catch (err) {
        adminFeedback.textContent = err.message || "Falha ao limpar canal";
      }
    });

    adminRefreshActivityButton.addEventListener("click", () => {
      refreshAdminActivity().catch(() => {
        adminFeedback.textContent = "Falha ao atualizar atividade";
      });
    });

    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];

      if (!file) {
        return;
      }

      showFilePreview(file);
    });

    messageInput.addEventListener("input", () => {
      const value = messageInput.value.trim();

      if (!value) {
        stopTyping().catch(() => {});
        return;
      }

      startTyping().catch(() => {});

      if (typingStopTimeoutId) {
        clearTimeout(typingStopTimeoutId);
      }

      typingStopTimeoutId = setTimeout(() => {
        stopTyping().catch(() => {});
      }, 2200);
    });

    messageInput.addEventListener("blur", () => {
      stopTyping().catch(() => {});
    });

    addChannelButton.addEventListener("click", async () => {
      const name = prompt("Nome do novo canal:", "novo-canal");

      if (name === null) {
        return;
      }

      addChannelButton.disabled = true;

      try {
        await createChannel(name);
      } catch (err) {
        alert(err.message || "Falha ao criar canal");
      } finally {
        addChannelButton.disabled = false;
      }
    });

    document.getElementById("composerForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      try {
        await send();
        stopTyping().catch(() => {});
      } catch (err) {
        alert(err.message || "Falha ao enviar mensagem");
      }
    });

    loadNoiseSuppressionPreference();
    loadVolumePreferences();

    tryRestoreSession().catch(() => {
      clearSession();
    });

    updateVoiceUi();
    updateNoiseSuppressionUi();
    updateVolumeUi();
    setUploadProgress(0);
  </script>
</body>
</html>
