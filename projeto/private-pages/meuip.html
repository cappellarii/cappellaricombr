<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meu IP Publico</title>
  <style>
    :root {
      --text: #e5e7eb;
      --muted: #9ca3af;
      --panel-bg: rgba(7, 11, 20, 0.62);
      --panel-border: rgba(255, 255, 255, 0.18);
      --card-bg: rgba(18, 43, 46, 0.72);
      --card-border: rgba(113, 194, 184, 0.22);
      --button-bg: rgba(31, 99, 88, 0.92);
      --button-border: rgba(110, 231, 213, 0.32);
      --button-text: #ecfdf5;
      --secondary-bg: rgba(20, 53, 56, 0.88);
      --secondary-border: rgba(113, 194, 184, 0.3);
      --secondary-text: #e6f5f2;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      color: var(--text);
      font-family: Arial, sans-serif;
      background: #000;
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: linear-gradient(204deg, #000000, #416c69);
      background-size: 400% 400%;
      animation: gradient-shift 24s ease infinite;
    }

    .panel {
      width: min(560px, 100%);
      border-radius: 14px;
      border: 1px solid var(--panel-border);
      background: var(--panel-bg);
      backdrop-filter: blur(8px);
      padding: 18px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.4rem;
    }

    .description {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .ip-card {
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .ip-label {
      color: var(--muted);
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .ip-value {
      font-size: clamp(1.1rem, 2.8vw, 1.5rem);
      font-weight: 700;
      overflow-wrap: anywhere;
      line-height: 1.35;
    }

    .meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      height: 38px;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      padding: 0 14px;
    }

    #refreshButton {
      border: 1px solid var(--button-border);
      background: var(--button-bg);
      color: var(--button-text);
    }

    #refreshButton:hover {
      filter: brightness(1.08);
    }

    #copyButton {
      border: 1px solid var(--secondary-border);
      background: var(--secondary-bg);
      color: var(--secondary-text);
    }

    #copyButton:hover {
      filter: brightness(1.08);
    }

    .status {
      margin-top: 10px;
      min-height: 20px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    @keyframes gradient-shift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Meu IP Publico</h1>

    <section class="ip-card">
      <div class="ip-label">IPv4</div>
      <div id="ipv4Value" class="ip-value">Carregando...</div>
      <div class="ip-label" style="margin-top: 10px;">IPv6</div>
      <div id="ipv6Value" class="ip-value">Carregando...</div>
      <div id="metaInfo" class="meta"></div>
    </section>

    <div class="actions">
      <button id="refreshButton" type="button">Atualizar</button>
      <button id="copyButton" type="button">Copiar IPs</button>
    </div>

    <div id="status" class="status"></div>
  </main>

  <script>
    const ipv4Value = document.getElementById("ipv4Value");
    const ipv6Value = document.getElementById("ipv6Value");
    const metaInfo = document.getElementById("metaInfo");
    const status = document.getElementById("status");
    const refreshButton = document.getElementById("refreshButton");
    const copyButton = document.getElementById("copyButton");

    function formatDateTime(value) {
      const date = new Date(value);

      if (!Number.isFinite(date.getTime())) {
        return "";
      }

      return new Intl.DateTimeFormat("pt-BR", {
        dateStyle: "short",
        timeStyle: "medium"
      }).format(date);
    }

    async function loadIp() {
      status.textContent = "Buscando IP...";

      try {
        const response = await fetch("/api/meu-ip", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Falha ao consultar IP");
        }

        const payload = await response.json();
        const ipv4 = payload.ipv4 ? String(payload.ipv4) : "Indisponivel";
        const ipv6 = payload.ipv6 ? String(payload.ipv6) : "Indisponivel";

        ipv4Value.textContent = ipv4;
        ipv6Value.textContent = ipv6;
        metaInfo.textContent = `Atualizado em ${formatDateTime(payload.at)}`;
        status.textContent = "IPs carregados com sucesso.";
      } catch (error) {
        ipv4Value.textContent = "Nao foi possivel carregar";
        ipv6Value.textContent = "Nao foi possivel carregar";
        metaInfo.textContent = "";
        status.textContent = "Erro ao consultar o IP.";
      }
    }

    async function copyIp() {
      const ipv4 = String(ipv4Value.textContent || "").trim();
      const ipv6 = String(ipv6Value.textContent || "").trim();
      const valuesToCopy = [];

      if (ipv4 && ipv4 !== "Indisponivel" && !ipv4.includes("Nao foi possivel") && ipv4 !== "Carregando...") {
        valuesToCopy.push(`IPv4: ${ipv4}`);
      }

      if (ipv6 && ipv6 !== "Indisponivel" && !ipv6.includes("Nao foi possivel") && ipv6 !== "Carregando...") {
        valuesToCopy.push(`IPv6: ${ipv6}`);
      }

      if (valuesToCopy.length === 0) {
        status.textContent = "Nada para copiar ainda.";
        return;
      }

      try {
        await navigator.clipboard.writeText(valuesToCopy.join("\n"));
        status.textContent = "IPs copiados para a area de transferencia.";
      } catch (_error) {
        status.textContent = "Nao foi possivel copiar automaticamente.";
      }
    }

    refreshButton.addEventListener("click", loadIp);
    copyButton.addEventListener("click", copyIp);

    loadIp();
  </script>
</body>
</html>
