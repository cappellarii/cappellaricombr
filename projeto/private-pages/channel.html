<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Canal</title>
  <style>
    :root {
      --bg-start: #000000;
      --bg-end: #416c69;
      --card-bg: rgba(7, 11, 20, 0.62);
      --card-border: rgba(255, 255, 255, 0.18);
      --text: #e5e7eb;
      --muted: #9ca3af;
      --cta: rgba(31, 99, 88, 0.92);
      --cta-border: rgba(110, 231, 213, 0.32);
      --video-bg: rgba(18, 43, 46, 0.72);
      --video-border: rgba(113, 194, 184, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--text);
      background: #000;
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      background: linear-gradient(204deg, var(--bg-start), var(--bg-end));
      background-size: 400% 400%;
      animation: channel-gradient 24s ease infinite;
    }

    .card {
      width: min(680px, 100%);
      max-height: calc(100dvh - 40px);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 28px;
      text-align: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
      overflow: auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.6rem, 2.6vw, 2.1rem);
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.45;
    }

    button {
      border: 1px solid var(--cta-border);
      border-radius: 999px;
      padding: 12px 24px;
      background: var(--cta);
      color: #ecfdf5;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease;
    }

    button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .video-wrap {
      margin-top: 18px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--video-border);
      background: var(--video-bg);
    }

    .video-wrap iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
    }

    @keyframes channel-gradient {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Canal reservado</h1>
    <p>Tem certeza que quer abrir o conteudo especial? Clique no botao abaixo.</p>
    <button id="revealButton" type="button">Abrir canal</button>
    <section id="videoArea" class="video-wrap" hidden></section>
  </main>

  <script>
    const revealButton = document.getElementById("revealButton");
    const videoArea = document.getElementById("videoArea");

    revealButton.addEventListener("click", () => {
      if (!videoArea.firstChild) {
        const iframe = document.createElement("iframe");
        iframe.src = "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&rel=0";
        iframe.title = "Rick Astley - Never Gonna Give You Up";
        iframe.allow = "autoplay; encrypted-media; picture-in-picture; web-share";
        iframe.referrerPolicy = "strict-origin-when-cross-origin";
        iframe.allowFullscreen = true;
        videoArea.appendChild(iframe);
      }

      videoArea.hidden = false;
      revealButton.hidden = true;
    });
  </script>
</body>
</html>
